# Netlify deployment config — LONA (Vite SPA + Convex backend)
#
# This is a FRONTEND-ONLY build. It does NOT run `convex deploy`, so it does
# not require CONVEX_DEPLOY_KEY or access to the Convex account.
# The committed files under src/convex/_generated/ are used for types.
#
# Required environment variable (set in Netlify → Site settings → Env vars):
#   VITE_CONVEX_URL=https://<your-deployment>.convex.cloud

[build]
  command = "npm run build:frontend"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — every route falls through to index.html so React Router
# handles /shop, /account, /admin/... etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
