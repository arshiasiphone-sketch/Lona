<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lona">
  <defs>
    <radialGradient id="pearl" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#FBF1E2" />
      <stop offset="55%" stop-color="#F1DDC6" />
      <stop offset="100%" stop-color="#D9B8A0" />
    </radialGradient>
    <radialGradient id="sheen" cx="32%" cy="22%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2C2A" />
      <stop offset="100%" stop-color="#1F1816" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#pearl)" />
  <circle cx="100" cy="100" r="96" fill="url(#sheen)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1" />
  <!-- LONA wordmark -->
  <text x="100" y="118" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Fraunces', 'Times New Roman', serif"
        font-size="44" font-weight="500" fill="url(#ink)"
        letter-spacing="6">LONA</text>
  <!-- 4-point sparkle nested inside the O -->
  <g transform="translate(100 100)" fill="#7C5A3E">
    <path d="M0,-5.2 C0.6,-1.8 1.8,-0.6 5.2,0 C1.8,0.6 0.6,1.8 0,5.2 C-0.6,1.8 -1.8,0.6 -5.2,0 C-1.8,-0.6 -0.6,-1.8 0,-5.2 Z" />
    <circle r="0.9" />
  </g>
</svg>
